    "RUSTSEC-2024-0436", # paste: compile-time macro only; zero runtime footprint
    "RUSTSEC-2026-0543", # chrono: transitive via tracing/plotters; used only for log timestamps
    "RUSTSEC-2025-0141", # bincode: internal asset serialization inside typst-bake
    "RUSTSEC-2026-0192", # ttf-parser: parses only our own baked static fonts (typst-bake/plotters)
    "RUSTSEC-2026-0206", # rustybuzz: text shaping for static baked fonts inside typst-bake
